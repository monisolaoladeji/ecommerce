<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}QuickCart{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js" crossorigin="anonymous"></script>
</head>
<body>
    <header class="site-header">
        <div class="container nav">
            <a href="{{ url_for('index') }}" class="brand">QuickCart</a>
            <form class="search-form" action="{{ url_for('index') }}" method="GET">
                <input type="text" name="q" placeholder="Search products..." class="search-input" value="{{ search_query if search_query else '' }}">
                <button type="submit" class="search-btn">Search</button>
            </form>
            <nav>
                <a href="{{ url_for('index') }}">Products</a>
                <a href="{{ url_for('cart_page') }}">Cart (<span id="cart-count">{{ cart.count }}</span>)</a>
            </nav>
        </div>
    </header>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <script>
        window.initialCart = {{ cart | tojson }};
        window.products = {{ products | tojson if products else '[]' }};
    </script>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
