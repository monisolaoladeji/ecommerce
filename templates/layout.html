<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}QuickCart{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js" crossorigin="anonymous"></script>
</head>
<body>
    <header class="site-header">
        <div class="container nav">
            <a href="{{ url_for('index') }}" class="brand">QuickCart</a>
            <nav>
                <a href="{{ url_for('index') }}">Products</a>
                <a href="{{ url_for('cart_page') }}">Cart (<span id="cart-count">{{ cart.count }}</span>)</a>
            </nav>
        </div>
    </header>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <script>
        window.initialCart = {{ cart | tojson }};
    </script>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
